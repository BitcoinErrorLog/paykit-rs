[package]
name = "paykit-interactive"
version = "0.2.0"
edition = "2021"
description = "Interactive payment protocols and receipts for Paykit over Pubky Noise"

[lib]
# Doc-tests pass individually but fail in workspace-wide --all-features due to
# feature-set conflicts on pubky-noise (pubky-sdk vs pubky). Run doc-tests with:
# cargo test -p paykit-interactive --doc
doctest = false

[dependencies]
paykit-lib = { path = "../paykit-lib", features = ["pubky"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
async-trait = "0.1"
tokio = { version = "1.0", features = ["time"], optional = true }
tracing = { version = "0.1", optional = true }
sha2 = "0.10"
hex = "0.4"

pubky-crypto = { path = "../../pubky-crypto" }
pubky-noise = { path = "../../pubky-noise", features = ["pubky-sdk"] }

[features]
default = ["timeout", "tcp-transport"]
timeout = ["tokio"]
tcp-transport = []
tracing = ["dep:tracing"]
# Enable real proof verification with Esplora API
http-executor = ["paykit-lib/http-executor"]

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
rand = "0.8"
pubky = { git = "https://github.com/BitcoinErrorLog/pubky-core", rev = "290d801" }
ed25519-dalek = "2.1"
sha2 = "0.10"
